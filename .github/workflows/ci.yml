name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Python tests and lint
        run: |
          ruff check .
          python -m compileall -q src services tests
          pytest

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements-dev.txt
          pip-audit -r services/healthcare-api/requirements.txt
          pip-audit -r services/etl-service/requirements.txt
          pip-audit -r services/notification-service/requirements.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate dev
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform validate prod
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

      - name: Helm lint and render
        run: |
          helm lint helm-charts/healthcare-platform
          helm template healthcare helm-charts/healthcare-platform --namespace healthcare-dev >/tmp/healthcare.yaml

      - name: Validate YAML and JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path(".").rglob("*.yaml"):
              if "helm-charts" in path.parts and "templates" in path.parts:
                  continue
              list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
          for path in Path(".").rglob("*.yml"):
              if "helm-charts" in path.parts and "templates" in path.parts:
                  continue
              list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
          PY

      - name: dbt parse
        env:
          SNOWFLAKE_ACCOUNT: example-account
          SNOWFLAKE_USER: SERVICE_DBT_HEALTHCARE
          SNOWFLAKE_ROLE: TRANSFORMER
          SNOWFLAKE_WAREHOUSE: HEALTHCARE_TRANSFORMING_WH
          SNOWFLAKE_DATABASE: HEALTHCARE_ANALYTICS
          SNOWFLAKE_SCHEMA: ANALYTICS
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_private_key.pem
        run: |
          python -m pip install -r requirements-dbt.txt
          cp dbt/profiles.yml.example dbt/profiles.yml
          touch "$SNOWFLAKE_PRIVATE_KEY_PATH"
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt parse --project-dir dbt --profiles-dir dbt

  docker-build:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    strategy:
      matrix:
        service:
          - healthcare-api
          - etl-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}:${{ github.sha }} .
