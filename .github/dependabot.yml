      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /services/healthcare-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /services/etl-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
