apiVersion: v1
kind: Service
metadata:
  name: {{ include "healthcare-platform.fullname" . }}-api
  labels:
    {{- include "healthcare-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-api
spec:
  type: ClusterIP
  selector:
    {{- include "healthcare-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "healthcare-platform.fullname" . }}-notification
  labels:
    {{- include "healthcare-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-service
spec:
  type: ClusterIP
  selector:
    {{- include "healthcare-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notification-service
  ports:
    - name: http
      port: 80
      targetPort: http
