apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "healthcare-platform.fullname" . }}-notification
  labels:
    {{- include "healthcare-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-service
spec:
  replicas: {{ .Values.notificationService.replicas }}
  selector:
    matchLabels:
      {{- include "healthcare-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notification-service
  template:
    metadata:
      labels:
        {{- include "healthcare-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notification-service
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.notificationService.port | quote }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.notificationService.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.notificationService.port }}
          envFrom:
            - configMapRef:
                name: {{ include "healthcare-platform.fullname" . }}-config
          env:
            - name: SERVICE_NAME
              value: notification-service
            - name: NOTIFICATION_WEBHOOK_URL_FILE
              value: /mnt/secrets-store/notification-webhook-url
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "healthcare-platform.fullname" . }}-kv
