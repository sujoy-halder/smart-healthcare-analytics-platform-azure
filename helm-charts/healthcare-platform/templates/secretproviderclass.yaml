apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "healthcare-platform.fullname" . }}-kv
  labels:
    {{- include "healthcare-platform.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: healthcare-runtime-secrets
      type: Opaque
      data:
        - objectName: identifier-salt
          key: identifier-salt
        - objectName: snowflake-private-key
          key: snowflake-private-key
        - objectName: notification-webhook-url
          key: notification-webhook-url
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: identifier-salt
          objectType: secret
        - |
          objectName: snowflake-private-key
          objectType: secret
        - |
          objectName: notification-webhook-url
          objectType: secret
