{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "healthcare-platform.fullname" . }}-api
  labels:
    {{- include "healthcare-platform.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "healthcare-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingestion-api
{{- end }}
